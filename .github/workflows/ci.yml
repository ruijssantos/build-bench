name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      # docs/PLAN.md §4.1 — fails on a font size off the type scale in
      # tokens.css: a half-pixel, or anything under 16px that isn't a token.
      - run: npm run lint:css

      # Fails on a file nothing imports, an export nothing uses, or a
      # dependency nothing needs (knip.json). The scripts under scripts/ are
      # entry points of their own, run by hand.
      - run: npm run lint:dead

      # The pure logic in src/domain and the colour matcher: ratio and cup
      # maths, paint codes and search, status rules, extraction and research
      # normalisation. No database, no network, under two seconds.
      - run: npm test
      - run: npm run build

      # docs/PERFORMANCE.md — fails the build if the Thinner Bench's initial
      # payload grows past its budget, if the paint catalogue lands in an
      # eagerly-loaded chunk, or if a route loses its static shell.
      - run: npm run perf:budget

      # docs/PLAN.md §2.2 — fails the build if any paint code referenced by
      # the real inventory or the ratio rules is missing from the generated
      # catalogue (this is the check that would have caught XF-83/XF-84).
      - run: npm run catalogue:verify
