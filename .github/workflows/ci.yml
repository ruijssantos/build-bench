name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      # docs/PLAN.md §2.2 — fails the build if any paint code referenced by
      # the real inventory or the ratio rules is missing from the generated
      # catalogue (this is the check that would have caught XF-83/XF-84).
      - run: npm run catalogue:verify
